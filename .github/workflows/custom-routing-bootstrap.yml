name: Bootstrap custom routing

on:
  push:
    branches: [custom-model-routing]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor == 'immmh5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom-model-routing
          fetch-depth: 0

      - name: Integrate exact-match policy ranker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          target = Path('open-sse/services/combo/targetResolution.ts')
          text = target.read_text()

          import_line = 'import { applyPolicyRank } from "./policyRank.ts";\n'
          if import_line not in text:
              anchor = 'import { applyRequestTagRouting } from "./autoStrategy.ts";\n'
              if anchor not in text:
                  raise SystemExit('Could not find targetResolution import anchor')
              text = text.replace(anchor, anchor + import_line, 1)

          old = '''  orderedTargets = await applyPromptCacheStage(\n    deps,\n    orderedTargets,\n    continuity.sticky.stuck,\n    autoUsedExplicitRouter\n  );\n'''
          new = old + '''\n  // Operator policy is the final deterministic ordering layer. This intentionally\n  // runs after task-aware ordering and prompt-cache affinity so later stages cannot\n  // silently override the declared model/provider/account priority.\n  orderedTargets = applyPolicyRank(deps, orderedTargets);\n'''
          if 'orderedTargets = applyPolicyRank(deps, orderedTargets);' not in text:
              if old not in text:
                  raise SystemExit('Could not find prompt-cache stage anchor')
              text = text.replace(old, new, 1)

          target.write_text(text)

          test = Path('tests/unit/policyRank.test.ts')
          t = test.read_text()
          t = t.replace(
              'expect(result.map((item) => item.connectionId)).toEqual(["hf-2", "hf-1", null, null]);',
              'expect(result.map((item) => item.connectionId)).toEqual([null, "hf-1", "hf-2", null]);'
          )
          test.write_text(t)
          PY

      - name: Typecheck
        run: pnpm run typecheck:core

      - name: Policy unit test
        run: pnpm exec vitest run tests/unit/policyRank.test.ts

      - name: Commit integration and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/custom-routing-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add open-sse/services/combo/targetResolution.ts tests/unit/policyRank.test.ts .github/workflows/custom-routing-bootstrap.yml
          git diff --cached --quiet || git commit -m 'feat(routing): integrate exact-match policy ordering'
          git push origin custom-model-routing
